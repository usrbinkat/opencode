name: Upload artifact
description: Upload a build artifact with a single pinned version.

inputs:
  name:
    description: Artifact name
    required: false
    default: artifact
  path:
    description: A file, directory or wildcard pattern that describes what to upload
    required: true
  if-no-files-found:
    description: "Behavior if no files found: warn, error, or ignore"
    required: false
    default: warn
  retention-days:
    description: Duration after which artifact will expire in days (0 = default retention)
    required: false
  compression-level:
    description: Zlib compression level 0-9 (6 = default)
    required: false
    default: "6"
  overwrite:
    description: Delete matching artifact before upload
    required: false
    default: "false"
  include-hidden-files:
    description: Include hidden files in the artifact
    required: false
    default: "false"
  archive:
    description: Archive (zip) the artifact before uploading
    required: false
    default: "true"

outputs:
  artifact-id:
    description: Unique identifier for the uploaded artifact
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Download URL for the uploaded artifact
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 digest of the uploaded artifact
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
