name: Setup Docker build environment
description: >
  Install QEMU for multi-arch builds, configure Docker Buildx, and
  log in to the GitHub Container Registry.

inputs:
  # QEMU
  qemu-image:
    description: QEMU static binaries Docker image
    required: false
    default: ""
  qemu-platforms:
    description: Platforms to install QEMU emulators for (e.g. arm64,riscv64)
    required: false
    default: all
  qemu-cache-image:
    description: Cache the binfmt image to the GitHub Actions cache
    required: false
    default: "true"

  # Buildx
  buildx-version:
    description: Buildx version to install (e.g. v0.12.0, latest)
    required: false
    default: ""
  buildx-driver:
    description: Builder driver (docker-container, docker, remote, kubernetes)
    required: false
    default: docker-container
  buildx-driver-opts:
    description: Newline-delimited list of driver-specific options
    required: false
    default: ""
  buildx-buildkitd-flags:
    description: BuildKit daemon flags
    required: false
    default: ""
  buildx-buildkitd-config-inline:
    description: Inline BuildKit daemon configuration (TOML)
    required: false
    default: ""
  buildx-platforms:
    description: Fixed platforms for the builder node
    required: false
    default: ""
  buildx-keep-state:
    description: Preserve BuildKit state on cleanup (persistent self-hosted runners)
    required: false
    default: "false"
  buildx-cache-binary:
    description: Cache the buildx binary to the GitHub Actions cache
    required: false
    default: "true"
  buildx-cleanup:
    description: Remove temp files and builder at job end
    required: false
    default: "true"

  # Login
  login-registry:
    description: Docker registry to authenticate against
    required: false
    default: ghcr.io
  login-username:
    description: Registry username
    required: false
    default: ${{ github.repository_owner }}
  login-password:
    description: Registry password or token
    required: false
    default: ${{ github.token }}
  login-scope:
    description: Buildx-scoped credential scope (e.g. myorg/myimage@push)
    required: false
    default: ""
  login-ecr:
    description: "Whether the registry is ECR: auto, true, or false"
    required: false
    default: auto
  login-logout:
    description: Log out from the registry at job end
    required: false
    default: "true"

outputs:
  qemu-platforms:
    description: Available QEMU platforms (comma-separated)
    value: ${{ steps.qemu.outputs.platforms }}
  buildx-name:
    description: Builder name
    value: ${{ steps.buildx.outputs.name }}
  buildx-driver:
    description: Builder driver
    value: ${{ steps.buildx.outputs.driver }}
  buildx-platforms:
    description: Builder node platforms (preferred and/or available)
    value: ${{ steps.buildx.outputs.platforms }}
  buildx-nodes:
    description: Builder nodes metadata (JSON)
    value: ${{ steps.buildx.outputs.nodes }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: ${{ inputs.qemu-image }}
        platforms: ${{ inputs.qemu-platforms }}
        cache-image: ${{ inputs.qemu-cache-image }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      with:
        version: ${{ inputs.buildx-version }}
        driver: ${{ inputs.buildx-driver }}
        driver-opts: ${{ inputs.buildx-driver-opts }}
        buildkitd-flags: ${{ inputs.buildx-buildkitd-flags }}
        buildkitd-config-inline: ${{ inputs.buildx-buildkitd-config-inline }}
        platforms: ${{ inputs.buildx-platforms }}
        keep-state: ${{ inputs.buildx-keep-state }}
        cache-binary: ${{ inputs.buildx-cache-binary }}
        cleanup: ${{ inputs.buildx-cleanup }}

    - name: Login to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.login-registry }}
        username: ${{ inputs.login-username }}
        password: ${{ inputs.login-password }}
        scope: ${{ inputs.login-scope }}
        ecr: ${{ inputs.login-ecr }}
        logout: ${{ inputs.login-logout }}
