name: test

on:
  push:
    branches:
      - dev
      - v2
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  affected:
    name: app change detection
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    outputs:
      app: ${{ steps.packages.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-devshell

      - name: Check prior workflow run status
        id: prior-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=5" \
            --jq '.workflow_runs' 2>/dev/null || echo "[]")
          conclusion=$(echo "$runs" | jq -r \
            --argjson current "$CURRENT_RUN_ID" \
            '[.[] | select(.id != $current)][0].conclusion // "none"')
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Find affected packages
        id: packages
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.prior-run.outputs.conclusion }}" = "failure" ]; then
            echo "::notice::Prior workflow run failed — forcing e2e rerun"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun turbo ls --affected --filter=@opencode/app --output=json > affected.json
          bun -e 'const result = await Bun.file("affected.json").json(); console.log(`app=${result.packages.count > 0}`)' >> "$GITHUB_OUTPUT"

  # ── Parallel job 1: Effect lint rules (Linux only) ─────────────────
  lint:
    name: lint
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-devshell

      - name: Test Effect simplification rules
        run: bun run test:effect-simplification-rules

      - name: Check Effect patterns
        run: bun run lint:effect-patterns

      - name: Check Effect simplifications
        run: bun run lint:effect-simplifications

  # ── Parallel job 2: unit tests (Linux + Windows) ───────────────────
  test:
    name: test ${{ matrix.settings.name }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
          - name: windows
            host: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-devshell

      - uses: ./.github/actions/setup-git-identity

      - uses: ./.github/actions/setup-turbo-cache

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GITHUB_ACTIONS=false bun turbo test --concurrency=3
            exit 0
          fi
          GITHUB_ACTIONS=false bun turbo test --affected --concurrency=3
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

  # ── Parallel job 3: build verification (Linux + Windows) ───────────
  verify-build:
    name: verify build ${{ matrix.settings.name }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
          - name: windows
            host: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-devshell

      - name: Verify published codemode package
        if: runner.os == 'Linux'
        working-directory: packages/codemode
        run: bun run script/publish.ts --dry-run

      - name: Verify packed workerd SDK
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo verify:package --filter=@opencode/sdk
            exit 0
          fi
          bun turbo verify:package --affected --filter=@opencode/sdk
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Verify compiled service lifecycle
        timeout-minutes: 10
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      - uses: ./.github/actions/setup-devshell
        with:
          node-sea: "true"

      - name: Verify Node build
        timeout-minutes: 15
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

  # ── Parallel job 4: generated code checks (Linux only) ─────────────
  verify-generated:
    name: verify generated
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-devshell

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated documentation
        working-directory: services/www
        run: bun run check:generated

  # ── Parallel job 5: e2e browser tests (Linux + Windows) ────────────
  e2e:
    name: end-to-end browser test ${{ matrix.settings.name }}
    needs: affected
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
          - name: windows
            host: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45
    env:
      E2E_ENABLED: ${{ github.ref_name == 'v2' || needs.affected.outputs.app == 'true' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.E2E_ENABLED == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-devshell
        if: env.E2E_ENABLED == 'true'
        with:
          playwright: "true"

      - name: Setup Playwright
        if: env.E2E_ENABLED == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run app e2e tests against production build
        if: env.E2E_ENABLED == 'true'
        run: bun --cwd packages/app test:e2e:built
        env:
          CI: true
        timeout-minutes: 30

      - name: Verify service worker precaching and upgrades
        if: env.E2E_ENABLED == 'true'
        working-directory: packages/app
        run: bunx playwright test --config e2e/service-worker/playwright.config.ts
        timeout-minutes: 5

      - name: Upload Playwright artifacts
        if: always() && env.E2E_ENABLED == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

  # ── Gate: all parallel jobs must pass ──────────────────────────────
  results:
    name: test results
    if: always()
    needs: [lint, test, verify-build, verify-generated, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          results=("$LINT" "$TEST" "$VERIFY_BUILD" "$VERIFY_GENERATED" "$E2E")
          for result in "${results[@]}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All jobs passed"
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          VERIFY_BUILD: ${{ needs.verify-build.result }}
          VERIFY_GENERATED: ${{ needs.verify-generated.result }}
          E2E: ${{ needs.e2e.result }}
