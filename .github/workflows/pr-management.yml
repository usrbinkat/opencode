name: pr-management

on:
  pull_request_target:
    types: [opened]

jobs:
  check-duplicates:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          allow-unsafe-pr-checkout: true

      - name: Check team membership
        id: author
        uses: ./.github/actions/check-team-member
        with:
          login: ${{ github.event.pull_request.user.login }}
          association: ${{ github.event.pull_request.author_association }}

      - uses: ./.github/actions/setup-devshell
        if: steps.author.outputs.exempt != 'true'

      - name: Setup OpenCode
        if: steps.author.outputs.exempt != 'true'
        id: opencode
        uses: ./.github/actions/setup-opencode
        with:
          api-key: ${{ secrets.OPENCODE_API_KEY }}

      - name: Check for duplicate PRs
        if: steps.author.outputs.exempt != 'true' && steps.opencode.outputs.available == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: |
            {
              "bash": {
                "*": "deny",
                "gh pr*": "allow",
                "gh issue*": "allow"
              },
              "webfetch": "deny"
            }
        run: |
          opencode run -m opencode/claude-sonnet-4-6 "A new pull request has been opened:

          PR number: ${{ github.event.pull_request.number }}

          Lookup this PR with gh pr view ${{ github.event.pull_request.number }}.

          Search through existing open PRs (excluding #${{ github.event.pull_request.number }}) to find potential duplicates.
          Consider:
          1. Similar titles or descriptions
          2. Same files or components being changed
          3. Related functionality or features
          4. Similar bug fixes

          If duplicates are found, post a SINGLE comment on PR #${{ github.event.pull_request.number }} using gh pr comment with the following format:

          _The following comment was made by an LLM, it may be inaccurate:_

          This PR might be a duplicate of existing PRs. Please check:
          - #[pr_number]: [brief description of similarity]

          If no duplicates are found, do NOT comment."

  add-contributor-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: true

      - uses: ./.github/actions/setup-devshell

      - name: Add contributor label
        run: bun script/github/add-contributor-label.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
