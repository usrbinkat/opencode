name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - ci
      - dev
      - beta
      - v2
      - fix/npm-native-binary-install
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref_name == 'v2' && (inputs.version || inputs.bump) && 'release') || inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

env:
  OPENCODE_CHANNEL: ${{ (github.ref_name == 'v2' && !inputs.bump && !inputs.version && 'dev') || '' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Credential gate: check every external secret once, expose granular
  # flags so downstream jobs skip gracefully when credentials are absent.
  # ──────────────────────────────────────────────────────────────────────
  credentials:
    name: Check credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-github-app: ${{ steps.github-app.outputs.available }}
      has-apple-signing: ${{ steps.apple-signing.outputs.available }}
      has-azure-signing: ${{ steps.azure-signing.outputs.available }}
      has-cloudflare: ${{ steps.cloudflare.outputs.available }}
      has-aur: ${{ steps.aur.outputs.available }}
      has-sentry: ${{ steps.sentry.outputs.available }}
      has-opencode-api: ${{ steps.opencode-api.outputs.available }}
      has-cachix: ${{ steps.cachix.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GitHub App
        id: github-app
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Apple signing
        id: apple-signing
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.APPLE_CERTIFICATE }}

      - name: Azure signing
        id: azure-signing
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Cloudflare
        id: cloudflare
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: AUR
        id: aur
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.AUR_KEY }}

      - name: Sentry
        id: sentry
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: OpenCode API
        id: opencode-api
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.OPENCODE_API_KEY }}

      - name: Cachix
        id: cachix
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Version: compute version string from package metadata.
  # No credentials required — runs on every push including forks.
  # ──────────────────────────────────────────────────────────────────────
  version:
    needs: credentials
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-devshell

      - id: version
        run: ./script/version.ts
        env:
          OPENCODE_BUMP: ${{ inputs.bump }}
          OPENCODE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ (github.ref_name == 'beta' && format('{0}-beta', github.repository)) || github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  # ──────────────────────────────────────────────────────────────────────
  # Build CLI: compile Bun binaries for all platforms.
  # No credentials required — runs on every push including forks.
  # ──────────────────────────────────────────────────────────────────────
  build-cli:
    needs: [credentials, version]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-devshell

      - name: Build legacy CLI
        if: github.ref_name != 'v2' && github.ref_name != 'beta'
        run: ./packages/opencode/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ github.token }}

      - name: Build preview CLI
        id: build
        run: ./packages/cli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/upload-artifact
        if: github.ref_name != 'v2' && github.ref_name != 'beta'
        with:
          name: opencode-cli
          path: |
            packages/opencode/dist/opencode-darwin*
            packages/opencode/dist/opencode-linux*

      - uses: ./.github/actions/upload-artifact
        if: github.ref_name != 'v2' && github.ref_name != 'beta'
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows*

      - uses: ./.github/actions/upload-artifact
        with:
          name: opencode-preview-cli-unsigned
          path: packages/cli/dist/cli-*

    outputs:
      version: ${{ needs.version.outputs.version }}

  # ──────────────────────────────────────────────────────────────────────
  # Sign CLI macOS: codesign Darwin binaries with Developer ID
  # ──────────────────────────────────────────────────────────────────────
  sign-cli-macos:
    needs: [credentials, build-cli]
    if: needs.credentials.outputs.has-apple-signing == 'true'
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-apple-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: ./.github/actions/download-artifact
        with:
          name: opencode-preview-cli-unsigned
          path: packages/cli/dist

      - name: Sign macOS CLI binaries
        run: |
          identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found"
            exit 1
          fi

          found=0
          for file in packages/cli/dist/cli-darwin-*/bin/opencode; do
            if [ ! -f "$file" ]; then
              continue
            fi
            found=1
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements packages/cli/script/entitlements.plist \
              --sign "$identity" \
              "$file"
            codesign --verify --deep --strict --verbose=4 "$file"
            codesign --display --requirements - "$file"
          done

          if [ "$found" -eq 0 ]; then
            echo "No macOS CLI binaries found"
            exit 1
          fi

      - uses: ./.github/actions/upload-artifact
        with:
          name: opencode-preview-cli-macos
          path: packages/cli/dist/cli-*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build Node app archive.
  # No credentials required — runs on every push including forks.
  # ──────────────────────────────────────────────────────────────────────
  build-node-app-archive:
    needs: [credentials, version]
    if: "!(github.ref_name == 'v2' && (inputs.bump || inputs.version))"
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-devshell

      - name: Build app archive
        run: bun packages/cli/script/build-node.ts --app-archive-only --app-archive=.cache/app-archive.bin --skip-install
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}

      - uses: ./.github/actions/upload-artifact
        with:
          name: opencode-node-app-archive
          path: packages/cli/.cache/app-archive.bin
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build Node CLI: SEA binaries per platform.
  # No credentials required — runs on every push including forks.
  # ──────────────────────────────────────────────────────────────────────
  build-node-cli:
    needs:
      - credentials
      - version
      - build-node-app-archive
    if: "!(github.ref_name == 'v2' && (inputs.bump || inputs.version))"
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: linux-arm64
            host: ubuntu-24.04-arm
          - target: linux-x64
            host: ubuntu-24.04
          - target: darwin-arm64
            host: macos-15
          - target: windows-arm64
            host: windows-2025
            bun_install_flags: --cpu=*
          - target: windows-x64
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-devshell
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}
          node-sea: "true"

      - uses: ./.github/actions/download-artifact
        with:
          name: opencode-node-app-archive
          path: packages/cli/.cache

      - name: Build
        run: bun packages/cli/script/build-node.ts --target=${{ matrix.settings.target }} --skip-install --outdir=dist/node --app-archive=.cache/app-archive.bin
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}

      - name: Verify service lifecycle
        if: matrix.settings.target != 'windows-arm64'
        working-directory: packages/cli
        run: bun run script/service-smoke.ts --node

      - uses: ./.github/actions/upload-artifact
        with:
          name: opencode-node-cli-${{ matrix.settings.target }}
          path: packages/cli/dist/node/cli-node-*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Sign CLI Windows: Azure Trusted Signing.
  # Depends on build-cli (not sign-cli-macos) so unsigned builds still
  # produce artifacts on forks where macOS signing skips.
  # ──────────────────────────────────────────────────────────────────────
  sign-cli-windows:
    needs:
      - credentials
      - build-cli
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
    timeout-minutes: 15
    if: needs.credentials.outputs.has-azure-signing == 'true' && (github.ref_name == 'v2' || github.ref_name == 'beta')
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On the upstream org, macOS signing runs first and produces the merged
      # cli artifact. On forks, use the unsigned artifact directly.
      - uses: ./.github/actions/download-artifact
        with:
          name: ${{ needs.credentials.outputs.has-apple-signing == 'true' && 'opencode-preview-cli-macos' || 'opencode-preview-cli-unsigned' }}
          path: packages/cli/dist

      - uses: ./.github/actions/setup-azure-signing
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\cli\dist\cli-windows-arm64\bin\opencode.exe
            ${{ github.workspace }}\packages\cli\dist\cli-windows-x64\bin\opencode.exe
            ${{ github.workspace }}\packages\cli\dist\cli-windows-x64-baseline\bin\opencode.exe

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\cli\dist\cli-windows-arm64\bin\opencode.exe",
            "${{ github.workspace }}\packages\cli\dist\cli-windows-x64\bin\opencode.exe",
            "${{ github.workspace }}\packages\cli\dist\cli-windows-x64-baseline\bin\opencode.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: ./.github/actions/upload-artifact
        with:
          name: opencode-preview-cli
          path: packages/cli/dist/cli-*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build Electron: desktop app for all 6 platform targets.
  # Builds run on every push; signing steps are gated per-step.
  # ──────────────────────────────────────────────────────────────────────
  build-electron:
    needs:
      - credentials
      - version
      - build-cli
    if: github.ref_name != 'v2' || needs.version.outputs.release != ''
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-13
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-15
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - host: windows-2025
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/download-artifact
        with:
          name: opencode-preview-cli-unsigned
          path: packages/cli/dist

      - uses: ./.github/actions/setup-apple-signing
        if: runner.os == 'macOS' && needs.credentials.outputs.has-apple-signing == 'true'
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS' && needs.credentials.outputs.has-apple-signing == 'true'
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-devshell
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Azure login
        if: runner.os == 'Windows' && needs.credentials.outputs.has-azure-signing == 'true'
        uses: ./.github/actions/setup-azure-signing
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Setup apt packages (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        uses: ./.github/actions/setup-apt-cache
        with:
          key-suffix: ${{ matrix.settings.target }}-electron
          packages: rpm

      - name: Setup git committer
        id: committer
        if: needs.credentials.outputs.has-github-app == 'true'
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package
        if: needs.version.outputs.release && needs.credentials.outputs.has-github-app == 'true'
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release || needs.credentials.outputs.has-github-app != 'true' }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS' && needs.version.outputs.release
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="opencode-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="opencode-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && needs.credentials.outputs.has-azure-signing == 'true'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\resources\opencode-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: ./.github/actions/upload-artifact
        with:
          name: opencode-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: ./.github/actions/upload-artifact
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  # ──────────────────────────────────────────────────────────────────────
  # Publish: npm, GitHub release, AUR, containers.
  # Gated on has-github-app — skips entirely on forks.
  # ──────────────────────────────────────────────────────────────────────
  publish:
    needs:
      - credentials
      - version
      - build-cli
      - sign-cli-macos
      - build-node-app-archive
      - build-node-cli
      - sign-cli-windows
      - build-electron
    if: >-
      always() && !failure() && !cancelled() &&
      needs.credentials.outputs.has-github-app == 'true' &&
      github.repository_owner == 'anomalyco'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-devshell
        with:
          npm-publish: "true"

      - uses: ./.github/actions/setup-docker

      - name: Deploy update service
        if: github.ref_name == 'v2' && needs.credentials.outputs.has-cloudflare == 'true'
        working-directory: services/update
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Install OpenCode
        if: inputs.bump || inputs.version
        run: bun i -g opencode-ai

      - uses: ./.github/actions/download-artifact
        if: github.ref_name != 'v2' && github.ref_name != 'beta'
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - uses: ./.github/actions/download-artifact
        if: github.ref_name != 'v2' && github.ref_name != 'beta'
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      - uses: ./.github/actions/download-artifact
        if: github.ref_name != 'v2' && github.ref_name != 'beta'
        with:
          name: opencode-cli-signed-windows
          path: packages/opencode/dist

      - uses: ./.github/actions/download-artifact
        with:
          name: opencode-preview-cli
          path: packages/cli/dist

      - uses: ./.github/actions/download-artifact
        if: needs.build-node-cli.result == 'success'
        with:
          pattern: opencode-node-cli-*
          path: packages/cli/dist/node
          merge-multiple: true

      - uses: ./.github/actions/download-artifact
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: ./.github/actions/download-artifact
        if: needs.version.outputs.release
        with:
          pattern: opencode-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Setup apt packages (AUR)
        if: needs.credentials.outputs.has-aur == 'true'
        uses: ./.github/actions/setup-apt-cache
        with:
          key-suffix: aur
          packages: pacman-package-manager

      - uses: ./.github/actions/setup-git-identity
        if: needs.credentials.outputs.has-aur == 'true'
        with:
          email: opencode@${{ github.repository_owner }}.dev

      - name: Setup SSH for AUR
        if: needs.credentials.outputs.has-aur == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENCODE_DESKTOP_DIST: /tmp/desktop
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Nix cache: build and push to Cachix on release
  # ──────────────────────────────────────────────────────────────────────
  nix-cache:
    name: Nix Cache
    needs: [credentials, version, publish]
    if: needs.version.outputs.release != ''
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
