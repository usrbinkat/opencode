name: deploy-posts

on:
  push:
    branches:
      - v2
    paths:
      - packages/posts/**
      - bun.lock
      - .github/workflows/deploy-posts.yml
  workflow_dispatch:

concurrency:
  group: deploy-posts-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Cloudflare credentials
        id: creds
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: ./.github/actions/setup-devshell

      - name: Build
        working-directory: packages/posts
        run: bun run build

      - name: Deploy
        if: steps.creds.outputs.available == 'true'
        working-directory: packages/posts
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
