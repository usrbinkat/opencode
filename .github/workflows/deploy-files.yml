name: deploy-files

on:
  push:
    branches:
      - dev
      - v2
  workflow_dispatch:

concurrency:
  group: deploy-files-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Cloudflare credentials
        id: creds
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: ./.github/actions/setup-devshell

      - name: Typecheck
        working-directory: services/files
        run: bun typecheck

      - name: Deploy
        if: steps.creds.outputs.available == 'true'
        working-directory: services/files
        run: bun run deploy --env ${{ github.ref_name == 'v2' && 'production' || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
