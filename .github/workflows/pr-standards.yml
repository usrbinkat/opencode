name: pr-standards

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  check-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: true

      - name: Check team membership
        id: author
        uses: ./.github/actions/check-team-member
        with:
          login: ${{ github.event.pull_request.user.login }}
          association: ${{ github.event.pull_request.author_association }}

      - uses: ./.github/actions/setup-devshell
        if: steps.author.outputs.exempt != 'true'

      - name: Check PR standards
        if: steps.author.outputs.exempt != 'true'
        run: bun script/github/pr-standards.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  check-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: true

      - name: Check team membership
        id: author
        uses: ./.github/actions/check-team-member
        with:
          login: ${{ github.event.pull_request.user.login }}
          association: ${{ github.event.pull_request.author_association }}

      - uses: ./.github/actions/setup-devshell
        if: steps.author.outputs.exempt != 'true'

      - name: Check PR template compliance
        if: steps.author.outputs.exempt != 'true'
        run: bun script/github/pr-compliance.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHOR_EXEMPT: ${{ steps.author.outputs.exempt }}
