name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check team membership
        id: author
        uses: ./.github/actions/check-team-member
        with:
          login: ${{ github.event.issue.user.login }}
          association: ${{ github.event.issue.author_association }}

      - uses: ./.github/actions/setup-devshell
        if: steps.author.outputs.exempt != 'true'

      - name: Setup OpenCode
        if: steps.author.outputs.exempt != 'true'
        id: opencode
        uses: ./.github/actions/setup-opencode
        with:
          api-key: ${{ secrets.OPENCODE_API_KEY }}

      - name: Triage issue
        if: steps.author.outputs.exempt != 'true' && steps.opencode.outputs.available == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          opencode run --agent triage "The following issue was just opened, triage it:

          Title: $ISSUE_TITLE

          $ISSUE_BODY"
