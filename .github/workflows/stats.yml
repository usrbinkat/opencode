name: stats

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  stats:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check PostHog credentials
        id: creds
        uses: ./.github/actions/check-secret
        with:
          secret: ${{ secrets.POSTHOG_KEY }}

      - uses: ./.github/actions/setup-devshell

      - name: Run stats script
        if: steps.creds.outputs.available == 'true'
        run: bun script/stats.ts

      - uses: ./.github/actions/setup-git-identity
        if: steps.creds.outputs.available == 'true'
        with:
          name: GitHub Action
          email: action@github.com

      - name: Commit stats
        if: steps.creds.outputs.available == 'true'
        run: |
          git add STATS.md
          git diff --staged --quiet || git commit -m "ignore: update download stats $(date -I)"
          git push
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
